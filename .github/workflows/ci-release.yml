name: Windows checks and preview release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.1
      - name: Check format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package and checksum
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $metadata.packages[0].version
          if ($env:BUILD_REF.StartsWith('refs/tags/') -and $env:BUILD_TAG -ne "v$version") {
            throw 'Tag and Cargo version differ.'
          }
          $archive = "dist/switchbite-$version-windows-x64.zip"
          cargo run --release --locked --bin package-plugin -- --binary target/release/switchbite.exe --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath dist/plugin-SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switchbite-windows-x64
          path: dist/*
          if-no-files-found: error

  minimum-rust:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check declared minimum compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.89.0 check --all-targets --locked

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, minimum-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: switchbite-windows-x64
          path: dist
      - name: Publish checked preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease \
              --title "Switchbite $RELEASE_TAG — public preview" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
